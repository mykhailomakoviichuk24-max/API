services:
  mongo:
    image: mongo:latest
    container_name: library_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: pass
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: library_api
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://user:pass@mongo:27017
    depends_on:
      - mongo

volumes:
  mongo_data: